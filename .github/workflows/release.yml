# Pushing a tag (v1.2.3 or 1.2.3, matching "version" in theme.json) builds the
# base theme, without any deployment's data, and publishes it as the release
# asset theme.tar.gz, which is what the hub installs from a repository URL.
name: release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches theme.json
        run: |
          want="$(node -p "require('./theme.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "tag $GITHUB_REF_NAME != theme.json $want"; exit 1; }
      - run: npm run pack:base
      - name: Publish theme.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz --title "Atlas $GITHUB_REF_NAME" --generate-notes
